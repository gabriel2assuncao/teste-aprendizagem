<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eu te amo! ❤️</title>
  <link rel="stylesheet" href="love.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mural de fotos em mosaico de fundo -->
  <div class="photo-mosaic">
    <div class="photo-item"><img src="foto1.jpg" alt="Foto"></div>
    <div class="photo-item"><img src="foto2.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto3.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto4.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto5.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto7.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto8.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto9.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto10.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto11.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto13.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto14.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto15.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto16.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto17.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto18.jpg" alt="Foto"></div>
    <div class="photo-item"><img src="foto19.jpeg" alt="Foto"></div>
    <!-- Repetições para cobrir bem telas largas -->
    <div class="photo-item"><img src="foto8.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto9.jpeg" alt="Foto"></div>
    <div class="photo-item"><img src="foto11.jpeg" alt="Foto"></div>
  </div>

  <!-- Película vermelha translúcida suave -->
  <div class="overlay"></div>

  <!-- Tela da pergunta com botão que foge -->
  <div class="question-container" id="questionContainer">
    <div class="card">
      <span class="emoji-topo">🥺👉👈</span>
      <h2>Você me ama, Costelinha?</h2>
      <div class="btn-group">
        <button id="yesBtn" class="btn btn-yes">Sim! ❤️</button>
        <button id="noBtn" class="btn btn-no">Não 😢</button>
      </div>
    </div>
  </div>

  <!-- Tela da animação pós-clique -->
  <div class="heart-container" id="heartContainer" style="display: none;">
    <svg viewBox="0 0 1000 350" class="svg-text">
      <text x="50%" y="38%" text-anchor="middle" dominant-baseline="middle" class="text">
        Eu te amo minha preta!
      </text>
      <text x="50%" y="70%" text-anchor="middle" dominant-baseline="middle" class="text subtitle">
        saudades de você costelinha...
      </text>
    </svg>

    <div class="heart"></div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const questionContainer = document.getElementById("questionContainer");
    const heartContainer = document.getElementById("heartContainer");

    function moveButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 40;
      const maxY = window.innerHeight - noBtn.offsetHeight - 40;

      const newX = Math.max(20, Math.floor(Math.random() * maxX));
      const newY = Math.max(20, Math.floor(Math.random() * maxY));

      noBtn.style.position = "fixed";
      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    }

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveButton();
    });

    yesBtn.addEventListener("click", () => {
      questionContainer.style.opacity = "0";
      setTimeout(() => {
        questionContainer.style.display = "none";
        heartContainer.style.display = "flex";
      }, 300);
    });
  </script>
</body>
</html>
